<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCraft AI • Webapp & Cloud Sync (PC / Mobile)</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Firebase SDKs (Compat for robust standalone browser execution) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-obsidian: #080B10;
            --bg-surface: #0E131F;
            --bg-surface-elevated: #161D2E;
            --border-tech: rgba(0, 229, 255, 0.18);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00E5FF;
            --neon-purple: #B388FF;
            --neon-emerald: #00E676;
            --neon-amber: #FFB300;
            --neon-coral: #FF5252;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(14, 19, 31, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-tech);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00E5FF 0%, #B388FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.35);
        }

        .logo-icon span {
            color: #080B10;
            font-size: 20px;
            font-weight: 800;
        }

        .logo-title {
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #F8FAFC 0%, #00E5FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-pc-mobile {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(0, 230, 118, 0.12);
            color: var(--neon-emerald);
            border: 1px solid rgba(0, 230, 118, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon-emerald);
            box-shadow: 0 0 8px var(--neon-emerald);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .map-selector-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 6px 14px;
        }

        .map-selector-wrap select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .map-selector-wrap select option {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-cyan {
            background: var(--neon-cyan);
            color: #080B10;
        }
        .btn-cyan:hover {
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-tech);
        }

        .btn-emerald {
            background: rgba(0, 230, 118, 0.15);
            color: var(--neon-emerald);
            border-color: rgba(0, 230, 118, 0.3);
        }
        .btn-emerald:hover {
            background: rgba(0, 230, 118, 0.25);
        }

        /* User Profile Pill */
        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px 4px 4px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--neon-cyan);
        }

        .user-name {
            font-size: 12px;
            font-weight: 600;
        }

        /* Main Workspace Canvas */
        #viewport {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            overflow: hidden;
            cursor: grab;
            background-color: var(--bg-obsidian);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.03) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #world {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            width: 10000px;
            height: 10000px;
            pointer-events: none;
        }

        #connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        /* Node Cards */
        .node-card {
            position: absolute;
            width: 250px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-tech);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .node-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 12px 30px rgba(0, 229, 255, 0.25);
        }

        .node-card.selected {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.3), 0 12px 35px rgba(0, 229, 255, 0.35);
        }

        .node-card.root-node {
            width: 290px;
            border-color: var(--neon-cyan);
            background: linear-gradient(180deg, #162438 0%, var(--bg-surface) 100%);
        }

        .node-category-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .node-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .node-details {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-card-footer {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 8px;
        }

        /* Floating HUD Controls */
        .canvas-hud {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(14, 19, 31, 0.85);
            backdrop-filter: blur(16px);
            padding: 6px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-tech);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            z-index: 90;
        }

        .hud-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--neon-cyan);
        }

        .zoom-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            min-width: 48px;
            text-align: center;
        }

        /* Floating Tool Bar (Left Bottom) */
        .tools-bar {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 90;
        }

        /* Node Inspector / Editor Drawer */
        #inspector-panel {
            position: fixed;
            top: 74px;
            right: 24px;
            width: 340px;
            background: rgba(14, 19, 31, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-tech);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 95;
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        #inspector-panel.active {
            display: flex;
        }

        .inspector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input, .form-textarea, .form-select {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: var(--neon-cyan);
        }
        .form-textarea {
            resize: vertical;
            min-height: 70px;
        }

        /* Live Sync indicator pill */
        .live-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(0, 229, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 229, 255, 0.25);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            width: 90%;
            max-width: 540px;
            background: var(--bg-surface);
            border: 1px solid var(--border-tech);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Top App Bar -->
    <header>
        <div class="logo-area">
            <div class="logo-icon">
                <span class="material-symbols-outlined">hub</span>
            </div>
            <div>
                <div class="logo-title">MindCraft Webapp</div>
                <div style="font-size: 11px; color: var(--text-muted);">Real-time Cloud Sync (Mobile & PC)</div>
            </div>
            <div class="badge-pc-mobile">
                <div class="badge-dot"></div>
                <span>LIVE CLOUD DB</span>
            </div>
        </div>

        <div class="header-controls">
            <!-- Active Mind Map Selector -->
            <div class="map-selector-wrap">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--neon-cyan);">folder_open</span>
                <select id="map-select">
                    <option value="">Načítání cloudových map...</option>
                </select>
            </div>

            <button class="btn btn-ghost" id="btn-new-map" title="Vytvořit novou mapu">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                Nová mapa
            </button>

            <button class="btn btn-ghost" id="btn-auto-layout" title="Automaticky srovnat uzly bez překrývání">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--neon-emerald);">account_tree</span>
                Auto-Layout
            </button>

            <button class="btn btn-ghost" id="btn-vibe-export" title="Exportovat do Markdownu / Copilota">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--neon-purple);">terminal</span>
                Vibe Export
            </button>

            <!-- User Auth Area -->
            <div id="auth-container">
                <button class="btn btn-cyan" id="btn-login">
                    <span class="material-symbols-outlined" style="font-size: 18px;">login</span>
                    Google Přihlášení
                </button>
            </div>
        </div>
    </header>

    <!-- Infinite / Scalable Viewport Canvas -->
    <div id="viewport">
        <div id="world">
            <!-- Bezier connecting lines SVG -->
            <svg id="connections-layer"></svg>
            <!-- Dynamic Mind Nodes Container -->
            <div id="nodes-container"></div>
        </div>
    </div>

    <!-- Floating HUD Controls (Right Bottom) -->
    <div class="canvas-hud">
        <button class="hud-btn" id="btn-zoom-out" title="Oddálit (-)"><span class="material-symbols-outlined">remove</span></button>
        <span class="zoom-label" id="zoom-text">100%</span>
        <button class="hud-btn" id="btn-zoom-in" title="Přiblížit (+)"><span class="material-symbols-outlined">add</span></button>
        <div style="width: 1px; height: 18px; background: var(--border-subtle); margin: 0 4px;"></div>
        <button class="hud-btn" id="btn-zoom-reset" title="Resetovat pohled (100%)"><span class="material-symbols-outlined">center_focus_strong</span></button>
    </div>

    <!-- Floating Quick Actions (Left Bottom) -->
    <div class="tools-bar">
        <button class="btn btn-cyan" id="btn-add-node">
            <span class="material-symbols-outlined" style="font-size: 18px;">add_circle</span>
            Nový uzel
        </button>
        <div class="live-status-badge" id="sync-status">
            <span class="material-symbols-outlined" style="font-size: 16px;">cloud_done</span>
            <span id="sync-status-text">Synchronizováno s Cloudem</span>
        </div>
    </div>

    <!-- Node Inspector / Editor Drawer (Right Side) -->
    <div id="inspector-panel">
        <div class="inspector-header">
            <div style="font-weight: 800; font-size: 15px; color: var(--neon-cyan);">Detail & Úprava uzlu</div>
            <button class="hud-btn" id="btn-close-inspector"><span class="material-symbols-outlined">close</span></button>
        </div>

        <div class="form-group">
            <label class="form-label">Kategorie</label>
            <select class="form-select" id="node-category-input">
                <option value="GOAL">Cíl / Nápad</option>
                <option value="FEATURE">Funkcionalita</option>
                <option value="ARCHITECTURE">Architektura & Tech</option>
                <option value="RISK">Riziko / Výzva</option>
                <option value="SOLUTION">Řešení</option>
                <option value="ACTION_ITEM">Úkol / Krok</option>
                <option value="DIAGRAM">Procesní Diagram</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Název uzlu</label>
            <input type="text" class="form-input" id="node-title-input" placeholder="Název konceptu...">
        </div>

        <div class="form-group">
            <label class="form-label">Detaily a popis</label>
            <textarea class="form-textarea" id="node-details-input" placeholder="Architektonické detaily, kód nebo specifikace..."></textarea>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="btn btn-cyan" id="btn-save-node" style="flex: 1;">Uložit do Cloudu</button>
            <button class="btn btn-ghost" id="btn-add-child-node" title="Vytvořit podřízený uzel">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--neon-emerald);">add_link</span>
            </button>
            <button class="btn btn-ghost" id="btn-delete-node" title="Smazat uzel" style="color: var(--neon-coral);">
                <span class="material-symbols-outlined" style="font-size: 18px;">delete</span>
            </button>
        </div>
    </div>

    <!-- Modal for New Map Creation -->
    <div class="modal-overlay" id="modal-new-map">
        <div class="modal-card">
            <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--neon-cyan);">Nová myšlenková mapa</h2>
            <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label">Název projektu</label>
                <input type="text" class="form-input" id="new-map-title" placeholder="Např. Mobilní E-shop, Microservice AI...">
            </div>
            <div class="form-group" style="margin-bottom: 18px;">
                <label class="form-label">Popis / Cíl</label>
                <textarea class="form-textarea" id="new-map-desc" placeholder="Hlavní vize a architektonický záměr..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-ghost" id="btn-cancel-new-map">Zrušit</button>
                <button class="btn btn-cyan" id="btn-confirm-new-map">Vytvořit a synchronizovat</button>
            </div>
        </div>
    </div>

    <!-- Modal for Vibe Export -->
    <div class="modal-overlay" id="modal-export">
        <div class="modal-card" style="max-width: 650px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="font-size: 18px; color: var(--neon-purple);">Vibe Coding & Markdown Export</h2>
                <button class="hud-btn" id="btn-close-export"><span class="material-symbols-outlined">close</span></button>
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                Tento výstup můžete přímo zkopírovat do <strong>Cursor AI</strong>, <strong>Claude Code</strong> nebo <strong>GitHub Copilot</strong>:
            </p>
            <textarea class="form-textarea" id="export-textarea" style="height: 240px; font-family: 'JetBrains Mono', monospace; font-size: 12px;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
                <button class="btn btn-cyan" id="btn-copy-export">Kopírovat do schránky</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // 1. Firebase Initialization using project credentials from google-services.json
        const firebaseConfig = {
            apiKey: "AIzaSyA2GomsMyu-_Y6ine5pBiaTePNfvzdSBfM",
            authDomain: "exalted-skein-505810-u3.firebaseapp.com",
            projectId: "exalted-skein-505810-u3",
            storageBucket: "exalted-skein-505810-u3.firebasestorage.app",
            messagingSenderId: "575521619448",
            appId: "1:575521619448:web:craftmind-web"
        };

        let app, auth, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            console.error("Firebase init:", e);
        }

        // State variables
        let currentUser = null;
        let activeMapId = null;
        let allMaps = [];
        let nodes = [];
        let selectedNodeId = null;
        let liveNodesUnsubscribe = null;

        // Viewport Pan & Zoom state
        let scale = 1.0;
        let panX = 100;
        let panY = 100;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        const viewport = document.getElementById('viewport');
        const world = document.getElementById('world');
        const zoomText = document.getElementById('zoom-text');
        const connectionsLayer = document.getElementById('connections-layer');
        const nodesContainer = document.getElementById('nodes-container');
        const mapSelect = document.getElementById('map-select');
        const inspector = document.getElementById('inspector-panel');

        function updateTransform() {
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomText.innerText = `${Math.round(scale * 100)}%`;
        }

        // Viewport Navigation (Mouse Drag Pan & Scroll Zoom)
        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === world || e.target === connectionsLayer) {
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                selectedNodeId = null;
                renderNodes();
                closeInspector();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomDelta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(Math.max(scale * zoomDelta, 0.25), 3.5);

            // Zoom towards mouse pointer
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        document.getElementById('btn-zoom-in').onclick = () => {
            scale = Math.min(scale * 1.2, 3.5);
            updateTransform();
        };
        document.getElementById('btn-zoom-out').onclick = () => {
            scale = Math.max(scale / 1.2, 0.25);
            updateTransform();
        };
        document.getElementById('btn-zoom-reset').onclick = () => {
            scale = 1.0;
            panX = 120;
            panY = 120;
            updateTransform();
        };

        // 2. Firebase Authentication
        auth.onAuthStateChanged(user => {
            currentUser = user;
            const authContainer = document.getElementById('auth-container');
            if (user) {
                authContainer.innerHTML = `
                    <div class="user-pill">
                        <img class="user-avatar" src="${user.photoURL || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + user.uid}" alt="">
                        <span class="user-name">${user.displayName || user.email || 'Uživatel'}</span>
                        <button class="hud-btn" id="btn-logout" title="Odhlásit se" style="width: 24px; height: 24px;">
                            <span class="material-symbols-outlined" style="font-size: 16px; color: var(--neon-amber);">logout</span>
                        </button>
                    </div>
                `;
                document.getElementById('btn-logout').onclick = () => auth.signOut();
                loadUserMaps();
            } else {
                authContainer.innerHTML = `
                    <button class="btn btn-cyan" id="btn-login">
                        <span class="material-symbols-outlined" style="font-size: 18px;">login</span>
                        Google Přihlášení
                    </button>
                `;
                document.getElementById('btn-login').onclick = signInGoogle;
                mapSelect.innerHTML = `<option value="">Přihlaste se pro cloudové mapy</option>`;
                nodes = [];
                renderNodes();
            }
        });

        function signInGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                alert("Chyba přihlášení: " + err.message);
            });
        }

        // 3. Load Maps from Firestore
        async function loadUserMaps() {
            if (!currentUser) return;
            try {
                const snapshot = await db.collection("users").doc(currentUser.uid).collection("mind_maps").orderBy("updatedAt", "desc").get();
                allMaps = [];
                mapSelect.innerHTML = "";

                if (snapshot.empty) {
                    mapSelect.innerHTML = `<option value="">Žádná mapa v cloudu</option>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    allMaps.push({ id: doc.id, ...data });
                    const opt = document.createElement("option");
                    opt.value = doc.id;
                    opt.textContent = data.title || "Bez názvu";
                    mapSelect.appendChild(opt);
                });

                if (allMaps.length > 0) {
                    selectMap(allMaps[0].id);
                }
            } catch (err) {
                console.error("Chyba při načítání map:", err);
            }
        }

        mapSelect.onchange = (e) => {
            if (e.target.value) {
                selectMap(e.target.value);
            }
        };

        // 4. Real-time Firestore Sync for Nodes
        function selectMap(mapId) {
            activeMapId = mapId;
            mapSelect.value = mapId;
            if (liveNodesUnsubscribe) {
                liveNodesUnsubscribe();
            }

            setSyncStatus("Připojování k živému cloudu...", true);

            liveNodesUnsubscribe = db.collection("users")
                .doc(currentUser.uid)
                .collection("mind_maps")
                .doc(mapId)
                .collection("nodes")
                .onSnapshot(snapshot => {
                    const loadedNodes = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        loadedNodes.push({
                            id: doc.id,
                            mapId: mapId,
                            title: data.title || "Nový koncept",
                            details: data.details || "",
                            parentId: data.parentId || null,
                            category: data.category || "GOAL",
                            xPos: data.xPos || 100,
                            yPos: data.yPos || 100,
                            colorHex: data.colorHex || "#00E5FF"
                        });
                    });

                    nodes = loadedNodes;
                    renderNodes();
                    setSyncStatus("Synchronizováno v reálném čase s mobilem", false);
                }, err => {
                    console.error("Live sync error:", err);
                    setSyncStatus("Chyba syncu: " + err.message, false);
                });
        }

        function setSyncStatus(text, isBusy) {
            const statusEl = document.getElementById('sync-status-text');
            statusEl.innerText = text;
        }

        // 5. Render Nodes & Bezier Curves
        const CATEGORIES = {
            GOAL: { name: "Cíl / Nápad", color: "#00E5FF", bg: "rgba(0, 229, 255, 0.15)" },
            FEATURE: { name: "Funkcionalita", color: "#B388FF", bg: "rgba(179, 136, 255, 0.15)" },
            ARCHITECTURE: { name: "Architektura & Tech", color: "#00E676", bg: "rgba(0, 230, 118, 0.15)" },
            RISK: { name: "Riziko / Výzva", color: "#FF5252", bg: "rgba(255, 82, 82, 0.15)" },
            SOLUTION: { name: "Řešení", color: "#FFB300", bg: "rgba(255, 179, 0, 0.15)" },
            ACTION_ITEM: { name: "Úkol / Krok", color: "#FF4081", bg: "rgba(255, 64, 129, 0.15)" },
            DIAGRAM: { name: "Procesní Diagram", color: "#38BDF8", bg: "rgba(56, 189, 248, 0.15)" }
        };

        function renderNodes() {
            nodesContainer.innerHTML = "";
            connectionsLayer.innerHTML = "";

            const nodeMap = new Map();
            nodes.forEach(n => nodeMap.set(n.id, n));

            // Render Bezier Curves between parent and child
            nodes.forEach(node => {
                if (node.parentId && nodeMap.has(node.parentId)) {
                    const parent = nodeMap.get(node.parentId);
                    const pX = parent.xPos + (parent.parentId ? 250 : 290);
                    const pY = parent.yPos + 55;
                    const cX = node.xPos;
                    const cY = node.yPos + 55;

                    const ctrlDist = Math.max(Math.abs(cX - pX) * 0.5, 60);
                    const pathData = `M ${pX} ${pY} C ${pX + ctrlDist} ${pY}, ${cX - ctrlDist} ${cY}, ${cX} ${cY}`;

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", pathData);
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", node.colorHex || "#00E5FF");
                    path.setAttribute("stroke-width", "2.2");
                    path.setAttribute("stroke-opacity", "0.65");
                    connectionsLayer.appendChild(path);
                }
            });

            // Render Node Cards
            nodes.forEach(node => {
                const card = document.createElement("div");
                const isRoot = !node.parentId;
                card.className = `node-card ${isRoot ? 'root-node' : ''} ${node.id === selectedNodeId ? 'selected' : ''}`;
                card.style.left = `${node.xPos}px`;
                card.style.top = `${node.yPos}px`;

                const cat = CATEGORIES[node.category] || CATEGORIES.GOAL;

                card.innerHTML = `
                    <div class="node-category-pill" style="color: ${cat.color}; background: ${cat.bg}; border: 1px solid ${cat.color}40;">
                        ${cat.name}
                    </div>
                    <div class="node-title">${escapeHtml(node.title)}</div>
                    ${node.details ? `<div class="node-details">${escapeHtml(node.details)}</div>` : ''}
                    <div class="node-card-footer">
                        <span>${isRoot ? '🌟 Kořen mapy' : '🔗 Podřízený uzel'}</span>
                        <span style="font-family: monospace; font-size: 10px;">ID: ${node.id.substring(0, 5)}</span>
                    </div>
                `;

                // Node drag handling
                let isDraggingCard = false;
                let dragStartX = 0;
                let dragStartY = 0;
                let initialCardX = node.xPos;
                let initialCardY = node.yPos;

                card.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    isDraggingCard = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    initialCardX = node.xPos;
                    initialCardY = node.yPos;

                    selectNode(node);
                });

                window.addEventListener('mousemove', (e) => {
                    if (isDraggingCard) {
                        const dx = (e.clientX - dragStartX) / scale;
                        const dy = (e.clientY - dragStartY) / scale;
                        node.xPos = Math.round(initialCardX + dx);
                        node.yPos = Math.round(initialCardY + dy);
                        card.style.left = `${node.xPos}px`;
                        card.style.top = `${node.yPos}px`;
                        renderConnectionsOnly();
                    }
                });

                window.addEventListener('mouseup', () => {
                    if (isDraggingCard) {
                        isDraggingCard = false;
                        saveNodePositionToCloud(node);
                    }
                });

                nodesContainer.appendChild(card);
            });
        }

        function renderConnectionsOnly() {
            connectionsLayer.innerHTML = "";
            const nodeMap = new Map();
            nodes.forEach(n => nodeMap.set(n.id, n));

            nodes.forEach(node => {
                if (node.parentId && nodeMap.has(node.parentId)) {
                    const parent = nodeMap.get(node.parentId);
                    const pX = parent.xPos + (parent.parentId ? 250 : 290);
                    const pY = parent.yPos + 55;
                    const cX = node.xPos;
                    const cY = node.yPos + 55;

                    const ctrlDist = Math.max(Math.abs(cX - pX) * 0.5, 60);
                    const pathData = `M ${pX} ${pY} C ${pX + ctrlDist} ${pY}, ${cX - ctrlDist} ${cY}, ${cX} ${cY}`;

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", pathData);
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", node.colorHex || "#00E5FF");
                    path.setAttribute("stroke-width", "2.2");
                    path.setAttribute("stroke-opacity", "0.65");
                    connectionsLayer.appendChild(path);
                }
            });
        }

        async function saveNodePositionToCloud(node) {
            if (!currentUser || !activeMapId) return;
            try {
                await db.collection("users").doc(currentUser.uid)
                    .collection("mind_maps").doc(activeMapId)
                    .collection("nodes").doc(node.id)
                    .set({ xPos: node.xPos, yPos: node.yPos }, { merge: true });
            } catch (e) {
                console.error("Save pos error:", e);
            }
        }

        // 6. Node Inspector / Editing
        function selectNode(node) {
            selectedNodeId = node.id;
            document.getElementById('node-category-input').value = node.category || "GOAL";
            document.getElementById('node-title-input').value = node.title || "";
            document.getElementById('node-details-input').value = node.details || "";
            inspector.classList.add('active');
            renderNodes();
        }

        function closeInspector() {
            inspector.classList.remove('active');
            selectedNodeId = null;
        }
        document.getElementById('btn-close-inspector').onclick = closeInspector;

        document.getElementById('btn-save-node').onclick = async () => {
            if (!selectedNodeId || !currentUser || !activeMapId) return;
            const node = nodes.find(n => n.id === selectedNodeId);
            if (!node) return;

            const newTitle = document.getElementById('node-title-input').value.trim() || "Uzel";
            const newDetails = document.getElementById('node-details-input').value.trim();
            const newCategory = document.getElementById('node-category-input').value;
            const cat = CATEGORIES[newCategory] || CATEGORIES.GOAL;

            node.title = newTitle;
            node.details = newDetails;
            node.category = newCategory;
            node.colorHex = cat.color;

            await db.collection("users").doc(currentUser.uid)
                .collection("mind_maps").doc(activeMapId)
                .collection("nodes").doc(node.id)
                .set({
                    title: newTitle,
                    details: newDetails,
                    category: newCategory,
                    colorHex: cat.color
                }, { merge: true });

            closeInspector();
        };

        // Add child node
        document.getElementById('btn-add-child-node').onclick = async () => {
            if (!selectedNodeId || !currentUser || !activeMapId) return;
            const parent = nodes.find(n => n.id === selectedNodeId);
            if (!parent) return;

            const newId = "node_" + Date.now();
            const newNode = {
                id: newId,
                mapId: activeMapId,
                parentId: parent.id,
                title: "Nový podřízený krok",
                details: "Specifikace a implementace",
                category: "FEATURE",
                xPos: parent.xPos + 360,
                yPos: parent.yPos + (Math.random() * 80 - 40),
                colorHex: "#B388FF"
            };

            await db.collection("users").doc(currentUser.uid)
                .collection("mind_maps").doc(activeMapId)
                .collection("nodes").doc(newId)
                .set(newNode);
        };

        // Delete Node
        document.getElementById('btn-delete-node').onclick = async () => {
            if (!selectedNodeId || !currentUser || !activeMapId) return;
            if (confirm("Opravdu chcete smazat tento uzel?")) {
                await db.collection("users").doc(currentUser.uid)
                    .collection("mind_maps").doc(activeMapId)
                    .collection("nodes").doc(selectedNodeId)
                    .delete();
                closeInspector();
            }
        };

        // Add Independent / Root Node
        document.getElementById('btn-add-node').onclick = async () => {
            if (!currentUser || !activeMapId) {
                alert("Nejprve se přihlaste a otevřete mapu.");
                return;
            }
            const newId = "node_" + Date.now();
            const newNode = {
                id: newId,
                mapId: activeMapId,
                parentId: null,
                title: "Nový hlavní cíl",
                details: "Klíčový koncept projektu",
                category: "GOAL",
                xPos: 200 + Math.random() * 100,
                yPos: 200 + Math.random() * 100,
                colorHex: "#00E5FF"
            };

            await db.collection("users").doc(currentUser.uid)
                .collection("mind_maps").doc(activeMapId)
                .collection("nodes").doc(newId)
                .set(newNode);
        };

        // Auto Layout (Hierarchical Tree Layout without overlapping)
        document.getElementById('btn-auto-layout').onclick = async () => {
            if (nodes.length === 0 || !currentUser || !activeMapId) return;

            const rootNodes = nodes.filter(n => !n.parentId);
            const parentChildren = new Map();
            nodes.forEach(n => {
                if (n.parentId) {
                    if (!parentChildren.has(n.parentId)) parentChildren.set(n.parentId, []);
                    parentChildren.get(n.parentId).push(n);
                }
            });

            let currentRootY = 100;
            const batch = db.batch();

            function positionSubtree(node, depth, startY) {
                const nodeX = 100 + depth * 380;
                node.xPos = nodeX;
                node.yPos = startY;

                const nodeRef = db.collection("users").doc(currentUser.uid)
                    .collection("mind_maps").doc(activeMapId)
                    .collection("nodes").doc(node.id);
                batch.set(nodeRef, { xPos: node.xPos, yPos: node.yPos }, { merge: true });

                const children = parentChildren.get(node.id) || [];
                let childY = startY;
                children.forEach((child) => {
                    childY = positionSubtree(child, depth + 1, childY);
                    childY += 160; // Generous vertical gap to avoid overlap
                });

                return Math.max(startY, childY - 160);
            }

            rootNodes.forEach(root => {
                const endY = positionSubtree(root, 0, currentRootY);
                currentRootY = endY + 220;
            });

            await batch.commit();
            renderNodes();
        };

        // Create New Map Modal Handlers
        document.getElementById('btn-new-map').onclick = () => {
            if (!currentUser) {
                alert("Nejprve se přihlaste přes Google.");
                return;
            }
            document.getElementById('modal-new-map').classList.add('active');
        };
        document.getElementById('btn-cancel-new-map').onclick = () => {
            document.getElementById('modal-new-map').classList.remove('active');
        };
        document.getElementById('btn-confirm-new-map').onclick = async () => {
            const title = document.getElementById('new-map-title').value.trim();
            const desc = document.getElementById('new-map-desc').value.trim();
            if (!title) {
                alert("Zadejte název mapy.");
                return;
            }

            const mapId = "map_" + Date.now();
            const newMap = {
                id: mapId,
                userId: currentUser.uid,
                title: title,
                description: desc,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };

            // Save map document
            await db.collection("users").doc(currentUser.uid).collection("mind_maps").doc(mapId).set(newMap);

            // Create initial root node
            const rootNode = {
                id: "root_" + Date.now(),
                mapId: mapId,
                parentId: null,
                title: title,
                details: desc || "Hlavní koncept",
                category: "GOAL",
                xPos: 150,
                yPos: 200,
                colorHex: "#00E5FF"
            };
            await db.collection("users").doc(currentUser.uid).collection("mind_maps").doc(mapId).collection("nodes").doc(rootNode.id).set(rootNode);

            document.getElementById('modal-new-map').classList.remove('active');
            await loadUserMaps();
            selectMap(mapId);
        };

        // Vibe Coding Export
        document.getElementById('btn-vibe-export').onclick = () => {
            let md = `# ${allMaps.find(m => m.id === activeMapId)?.title || 'MindCraft AI Project'}\n\n`;
            md += `> Exportováno z MindCraft Webapp • Real-time Cloud Sync\n\n`;
            md += `## 🚀 Architektura a Struktura Uzlů\n\n`;

            nodes.forEach(n => {
                const prefix = n.parentId ? "  - " : "- 🎯 **";
                const suffix = n.parentId ? "" : "**";
                md += `${prefix}[${n.category}] ${n.title}${suffix}\n`;
                if (n.details) md += `    - *Popis:* ${n.details}\n`;
            });

            md += `\n## 🛠️ Instrukce pro Vibe Coder / Cursor AI\n`;
            md += `Implementuj výše uvedené komponenty s důrazem na čistou architekturu, TypeScript / Kotlin, a nulové kolize.\n`;

            document.getElementById('export-textarea').value = md;
            document.getElementById('modal-export').classList.add('active');
        };
        document.getElementById('btn-close-export').onclick = () => {
            document.getElementById('modal-export').classList.remove('active');
        };
        document.getElementById('btn-copy-export').onclick = () => {
            const ta = document.getElementById('export-textarea');
            ta.select();
            document.execCommand('copy');
            alert("Markdown zkopírován do schránky!");
        };

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        updateTransform();
    </script>
</body>
</html>
