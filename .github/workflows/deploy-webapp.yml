name: Deploy MindCraft Webapp to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-to-gh-pages-branch:
    name: Deploy to gh-pages branch (Zero-Config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy static files to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/public
          branch: gh-pages
          clean: true

  deploy-actions-pages:
    name: Deploy to GitHub Pages (Actions Mode)
    needs: deploy-to-gh-pages-branch
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/public'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
