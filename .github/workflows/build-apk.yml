name: Build & Release APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Vlastní verze (např. 1.0.5, nechte prázdné pro automatické číslování)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute Build Versioning
        id: versioning
        run: |
          BUILD_CODE=${{ github.run_number }}
          
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            BUILD_NAME="${{ github.event.inputs.release_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="1.0.${BUILD_CODE}"
          fi
          
          TAG_NAME="v${BUILD_NAME}"
          NOW_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          echo "VERSION_CODE=${BUILD_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${BUILD_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${NOW_DATE}" >> $GITHUB_ENV
          
          echo "Computed Version Code: ${BUILD_CODE}"
          echo "Computed Version Name: ${BUILD_NAME}"
          echo "Release Tag: ${TAG_NAME}"

      - name: Prepare build environment & secrets
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Environment secrets (.env)
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" >> .env
          fi

          # 2. Firebase / Google Services configuration
          if [ ! -f app/google-services.json ] || [ ! -s app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
              echo "Using GOOGLE_SERVICES_JSON secret..."
              printf '%s\n' "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "Creating fallback google-services.json for CI build..."
              cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "492326358514",
              "project_id": "gen-lang-client-0423108659",
              "storage_bucket": "gen-lang-client-0423108659.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:575521619448:android:ad44b68cf007c26480ea0d",
                  "android_client_info": {
                    "package_name": "com.aistudio.mindcraft.lelqfs"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBN2WO65zHlSmDhBpLezXmZR_wt_QeC_IU"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          echo "google-services.json status:"
          ls -lh app/google-services.json

          # 3. Android Debug Keystore
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
            if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
              echo "Generating fresh debug.keystore via keytool..."
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "debug.keystore status:"
          ls -lh debug.keystore

          # 4. Make gradlew executable
          chmod +x gradlew

      - name: Build Android APK
        env:
          BUILD_NUMBER: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            -Djava.awt.headless=true \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Pksp.incremental=false \
            --stacktrace

      - name: Package & rename APK
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          
          TARGET_APK="release-artifacts/Craftmind-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_FILE" "$TARGET_APK"
          echo "Prepared APK at: $TARGET_APK"
          ls -lh release-artifacts/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Craftmind-APK-v${{ env.VERSION_NAME }}
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Craftmind ${{ env.RELEASE_TAG }}
          body: |
            ## 🚀 Nové vydání aplikace Craftmind (${{ env.RELEASE_TAG }})
            
            - **Verze:** `${{ env.VERSION_NAME }}` (Build `#${{ env.VERSION_CODE }}`)
            - **Datum sestavení:** ${{ env.BUILD_DATE }}
            - **Commit:** `${{ github.sha }}`
            
            ### 📦 Ke stažení:
            Níže přiložený soubor `.apk` stáhněte a nainstalujte do svého zařízení se systémem Android.
            Aplikace v sobě obsahuje automatickou detekci této a budoucích aktualizací!
          files: |
            release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
